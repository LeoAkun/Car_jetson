/**:
  ros__parameters:
    registration_method: NDT_OMP # NDT、 NDT_OMP、 GICP、 GICP_OMP
    score_threshold: 2.0 # 匹配质量阈值，值越小要求匹配质量越高
    transform_epsilon: 0.001 # 收敛判断阈值，当两次迭代的变换矩阵差异小于此值时停止。值越小，迭代次数越多，精度越高

    # NDT专用参数
    ndt_resolution: 0.5 # NDT算法的体素网格分辨率（单位：米），值越小精度越高但计算量越大
    ndt_step_size: 0.1 # NDT优化的步长，控制每次迭代的移动距离，值越小收敛越慢但更精确
    ndt_num_threads: 8 # NDT_OMP使用的线程数，根据CPU核心数设置

    # 点云预处理参数
    voxel_leaf_size: 0.3 # 体素滤波器的网格大小（单位：米），值越大点云越稀疏，速度越快但精度降低
    scan_max_range: 50.0 # 点云有效距离范围（单位：米），过滤掉太近（噪声）和太远（不准确）的点
    scan_min_range: 1.0 # 激光扫描周期（单位：秒）
    scan_period: 0.1

    # 地图相关参数
    use_pcd_map: true # 是否使用PCD文件作为地图，true = 从文件加载，false = 订阅ROS话题
    # map_path: /home/akun/workspace/Car_jetson/cloudGlobal_clean.pcd # 实验室地图
    map_path: /home/akun/workspace/Car_jetson/GlobalMap3.pcd  # 地图文件的绝对路径。 室外地图
    use_odom: false # 是否使用里程计/IMU辅助定位。true = 用里程计预测位姿，减少匹配搜索范围
    use_imu: false
    enable_debug: true # 是否输出调试信息

    # 坐标系参数
    global_frame_id: map # 全局坐标系名称（地图坐标系）
    odom_frame_id: odom # 里程计坐标系名称
    base_frame_id: base_link # 机器人本体坐标系名称
    # lidar_topic: /livox_Pointcloud2
    lidar_topic: /rslidar_Pointcloud2 # 激光雷达点云话题名称

(-121.75, 1.11)