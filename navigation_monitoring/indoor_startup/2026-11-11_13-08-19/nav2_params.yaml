bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    controller_frequency: 30.0
    goal_checker_plugins:
    - general_goal_checker
    - charging_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker_plugin: progress_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 6.28
    charging_goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      stateful: false
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.08726646
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.02
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.75
      motion_model: Ackermann
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      vx_std: 0.4166666666666667
      vy_std: 0.3
      wz_std: 0.5
      vx_max: 0.5555555555555556
      vx_min: -0.5555555555555556
      vy_max: 0.0
      wz_max: 5.0
      ax_max: 0.6944444444444444
      ax_min: -0.6944444444444444
      ay_min: 0.0
      ay_max: 0.0
      az_max: 2.5
      iteration_count: 1
      prune_distance: 6.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: mppi::DefaultOptimalTrajectoryValidator
        collision_lookahead_time: 2.0
        consider_footprint: false
      AckermannConstraints:
        min_turning_r: 1.0
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      - ObstaclesCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.6
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 0.5
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.9
        critical_weight: 12.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.3
        near_goal_distance: 0.5
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 500000.0
        near_goal_distance: 1.0
        trajectory_point_step: 3
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      footprint: '[[-0.43, -0.28], [-0.43, 0.28], [0.43, 0.28], [0.43, -0.28]]'
      footprint_padding: 0.02
      transform_tolerance: 1.0
      message_filter_queue_size: 50
      rolling_window: true
      width: 15
      height: 15
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /laser/scan_merge_laser
          max_obstacle_height: 10.0
          min_obstacle_height: -5.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.1
          inf_is_valid: true
          tf_tolerance: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.55
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      message_filter_queue_size: 50
      use_sim_time: false
      footprint: '[[-0.43, -0.28], [-0.43, 0.28], [0.43, 0.28], [0.43, -0.28]]'
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        max_obstacle_height: 2.0
        scan:
          topic: /laser/scan_merge_laser
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: -5.0
          inf_is_valid: false
          tf_tolerance: 0.5
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.55
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: false
    use_image_magick: false
    yaml_filename: /home/akun/workspace/Car_jetson/navigation_monitoring/indoor_startup/2026-11-11_13-08-19/test_map.yaml
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 5.0
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 1.0
      angle_quantization_bins: 64
      cost_travel_multiplier: 3.0
      cost_penalty: 3.0
      non_straight_penalty: 1.3
      change_penalty: 0.0
      reverse_penalty: 2.1
      retrospective_penalty: 0.025
      rotation_penalty: 5.0
      analytic_expansion_ratio: 5.0
      analytic_expansion_max_length: 5.0
      analytic_expansion_max_cost: 200
      analytic_expansion_max_cost_override: false
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      allow_reverse_expansion: false
      smooth_path: false
      debug_visualizations: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.01
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
