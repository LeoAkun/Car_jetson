    - -0.5555555555555556
    - 0.0
    - -2.0
    max_accel:
    - 0.6944444444444444
    - 0.0
    - 3.2
    max_decel:
    - -0.6944444444444444
    - 0.0
    - -3.2
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
