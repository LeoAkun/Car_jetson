/cmdvel_to_ecu:  # 节点名
  ros__parameters:
    L: 0.5  # 轴距（米）
    LOW_SPEED_THRESH: 0.8 # 死区补偿下限，低于此速度但高于STOP_THRESH时提升到该值
    STOP_THRESH: 0.02 # 低于此速度认为是停车指令，直接归零不补偿死区
    Vel_Offeset: 0.03 # 保留生产环境的前进速度补偿；对接模式不使用
    OMEGA_DEADZONE: 0.020 # 低于这个角度认为打轮角度是0
    MAX_STEER_DEG: 30.0 # 舵机最大能打的转向角度
    OMEGA_FULL_STEER: 5.0 # 停车时推满摇杆对应的角速度 -> 5.0即对应最大转向角度, 或者说敏感度，数值越小越敏感
    rear_wheel_flag: True # 是否开启双阿克曼模式
    # Stage 3 command path. The mux publishes the selected command here.
    # Normal launch remains backward compatible; Stage 3 uses docking_config.yaml.
    cmd_vel_topic: /cmd_vel
    docking_mode: False
    docking_max_speed: 0.10
    docking_max_steer_deg: 8.0
    input_timeout_sec: 0.20
